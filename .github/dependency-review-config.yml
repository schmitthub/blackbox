# actions/dependency-review-action settings, read by the Dependency Review job
# in .github/workflows/security.yml.

fail-on-severity: moderate

# Same allowlist as the osv-scanner license gate (security.yml, prek.toml).
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - MPL-2.0

comment-summary-in-pr: on-failure
