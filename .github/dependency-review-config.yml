# actions/dependency-review-action settings, read by the Dependency Review job
# in .github/workflows/ci.yml.

fail-on-severity: moderate

# Same allowlist as the osv-scanner license gate (ci.yml, prek.toml).
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - MPL-2.0
  # Go's patent grant, attached to BSD-3-Clause on golang.org/x and protobuf.
  - LicenseRef-scancode-google-patent-license-golang

comment-summary-in-pr: on-failure
