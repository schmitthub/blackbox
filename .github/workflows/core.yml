name: core

# Jobs for the Go module in core/. Called by ci.yml, which decides what
# runs; never triggered on its own.
on:
  workflow_call:
    inputs:
      test:
        description: Run the build, lint and test jobs.
        type: boolean
        required: true
      scan:
        description: Run the CodeQL scan.
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  # golangci-lint reports issues new since the merge base with main
  # (new-from-merge-base in core/.golangci.yml).
  lint:
    name: golangci-lint
    if: inputs.test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The checkout is a detached HEAD; the merge base needs a local main.
      - name: Fetch main for new-from-merge-base
        run: git fetch --no-tags origin main:main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod

      # Keep the version in lockstep with the golangci-lint hook in core/prek.toml.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: core
          args: --config .golangci.yml

  test:
    name: Unit Tests
    if: inputs.test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the tools pinned in every mise.toml and mise.lock of the monorepo.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8

      - name: Mocks up to date
        run: |
          make -C core mocks
          git diff --exit-code

      - run: make -C core test

  integration:
    name: Integration Tests
    if: inputs.test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod

      - run: make -C core test-int

  migrations:
    name: Migration Tests
    if: inputs.test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the tools pinned in every mise.toml and mise.lock of the monorepo.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8

      - run: make -C core test-migrations

  # CodeQL sees only this project: a sparse checkout of core/, the Go version
  # of core/go.mod, and a category of its own, so its results stand beside
  # those of other projects in the same language.
  codeql:
    name: CodeQL
    if: inputs.scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: core

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go
          build-mode: autobuild

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:go;project:core
