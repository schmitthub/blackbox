name: CI

# Stacked pull requests: GitHub triggers workflows as if every layer targets
# the base of the stack, so `branches: [main]` runs this on every layer.
# https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/optimizing-ci-for-stacked-pull-requests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A workflow runs once per layer of a stack, so the heavy jobs (lint, unit
  # tests) run only on the two layers GitHub's guide
  # names. The top layer (position == size) holds the full set of changes.
  # The lowest unmerged layer (stack base == pull request base) is the next
  # to land; when it merges, GitHub rebases the next layer onto the base,
  # which re-triggers CI with that layer now the lowest. Cheap jobs run on
  # every layer. `stack` is null outside a stack: everything runs.
  #
  # A skipped job counts as a passing required check. A layer can only merge
  # together with every layer below it, and the layer being merged is either
  # the top or was tested in full when it became the lowest.
  #
  # Dependents test `!= 'false'`, so an empty output (this job failing) runs everything.
  stack:
    name: Stack gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      heavy: ${{ steps.gate.outputs.heavy }}
    steps:
      - name: Apply stack gate
        id: gate
        env:
          STACK: ${{ toJSON(github.event.pull_request.stack) }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "stack=$STACK"
          jq -nr --argjson s "$STACK" --arg base "$BASE" \
            'if $s == null or $s.position == $s.size or $s.base.ref == $base then "heavy=true" else "heavy=false" end' \
            | tee -a "$GITHUB_OUTPUT"

  # Everything except CodeQL runs on pull requests only; a push to main is a
  # merge of code that already passed. CodeQL also runs on main: pull request
  # scans compare against that analysis. golangci-lint reports issues new since
  # the merge base with main (new-from-merge-base in .golangci.yml).
  lint:
    name: golangci-lint
    needs: stack
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.stack.outputs.heavy != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The checkout is a detached HEAD; the merge base needs a local main.
      - name: Fetch main for new-from-merge-base
        run: git fetch --no-tags origin main:main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod

      # Keep the version in lockstep with the golangci-lint rev in prek.toml.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: core
          args: --config ../.golangci.yml

  test:
    name: Unit Tests
    needs: stack
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.stack.outputs.heavy != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod

      # Same version as mise.toml and the mockery hook in prek.toml.
      - name: Mocks up to date
        working-directory: core
        run: |
          go run github.com/vektra/mockery/v3@v3.9.1
          git diff --exit-code

      - run: make test

  integration:
    name: Integration Tests
    needs: stack
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.stack.outputs.heavy != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod

      - run: make test-int

  migrations:
    name: Migration Tests
    needs: stack
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.stack.outputs.heavy != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Creates .env from .env.example; the throwaway database needs no real secret.
      - run: scripts/setup.sh --env

      - run: make test-migrations

  # The agent-file layout check the agent-compat commit hook runs, plus the
  # checker's own tests. Needs python3 >= 3.11 (tomllib); ubuntu-24.04 has 3.12.
  agent-compat:
    name: Agent compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Agent compatibility
        run: python3 scripts/check-agent-compatibility.py

      - name: Checker tests
        run: python3 scripts/test_agent_compatibility.py

  semgrep:
    name: Semgrep SAST
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    container:
      # Keep the version in lockstep with the semgrep hook in prek.toml.
      image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only findings new since the base of the pull request. Exit codes:
      # without --error Semgrep exits 0 even with findings; with it, 1 on
      # findings, 2 on a bad baseline, 7 on a rule or config that fails to load.
      # Any of them fails this step; the upload below still runs.
      - name: Semgrep
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          semgrep scan --sarif --output semgrep.sarif --baseline-commit "$BASE_SHA" \
            --config p/golang --config p/security-audit --config p/github-actions --config .semgrep/ --error

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: Gitleaks Secrets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Keep the version in lockstep with the gitleaks rev in prek.toml.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${BASE_URL}/${ARCHIVE}" -o "${ARCHIVE}"
          curl -sSfL "${BASE_URL}/${CHECKSUMS}" -o "${CHECKSUMS}"
          grep " ${ARCHIVE}$" "${CHECKSUMS}" | sha256sum --check
          sudo tar xzf "${ARCHIVE}" -C /usr/local/bin gitleaks
          rm -f "${ARCHIVE}" "${CHECKSUMS}"

      - name: Gitleaks
        run: gitleaks git --report-format sarif --report-path gitleaks.sarif

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # comment-summary-in-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  # Not gated on stacked pull requests: a ruleset that requires code scanning
  # results needs a CodeQL upload for every language on every layer.
  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
