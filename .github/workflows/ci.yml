name: CI

# The monorepo's one workflow. It holds no project: `plan` finds the projects
# (every top-level directory with a ci.json) and decides what runs, and the
# jobs after it run once per project through a matrix. A new project needs no
# change here. The repository-wide jobs (security scans, agent files) follow
# and run on every pull request.
#
# Stacked pull requests: GitHub triggers workflows as if every layer targets
# the base of the stack, so `branches: [main]` runs this on every layer.
# https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/optimizing-ci-for-stacked-pull-requests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # scripts/ci-plan.sh explains each output. Workflow-level `paths` filters
  # are not used: a workflow skipped that way leaves required checks pending.
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
      checks: ${{ steps.plan.outputs.checks }}
      scans: ${{ steps.plan.outputs.scans }}
      unchanged: ${{ steps.plan.outputs.unchanged }}
    steps:
      # Full history: the script diffs against the merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          STACK: ${{ toJSON(github.event.pull_request.stack) }}
        run: scripts/ci-plan.sh | tee -a "$GITHUB_OUTPUT"

  # One job per project and check. A check is a make target of the project,
  # run with the tools of the project's mise.toml.
  check:
    name: ${{ matrix.name }} / ${{ matrix.check }}
    needs: plan
    if: needs.plan.outputs.checks != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # golangci-lint reports issues new since the merge base with main
      # (new-from-merge-base). The checkout is a detached HEAD; the merge
      # base needs a local main.
      - name: Fetch main
        run: git fetch --no-tags origin main:main

      # Installs the tools pinned in every mise.toml and mise.lock of the monorepo.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8

      - env:
          DIR: ${{ matrix.dir }}
          CHECK: ${{ matrix.check }}
        run: make -C "$DIR" "$CHECK"

  # One job per project and language. CodeQL sees only the project: a sparse
  # checkout of its directory and a category of its own, so its results stand
  # beside those of other projects in the same language. The Go toolchain is
  # the one the project's go.mod names.
  codeql:
    name: ${{ matrix.name }} / CodeQL (${{ matrix.language }})
    needs: plan
    if: needs.plan.outputs.scans != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.scans) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ${{ matrix.dir }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }};project:${{ matrix.dir }}

  # A pull request that leaves a project alone does not scan it, but code
  # scanning still expects every category that main has: without it the
  # CodeQL check ends neutral with "1 configuration not found". So copy the
  # latest results of the project's category from the base of the stack
  # (main) to the pull request. Nothing in the project changed, so they hold.
  # Same method as the republish step of
  # https://github.com/advanced-security/monorepo-code-scanning-action, which
  # reads the pull request's own base and so finds nothing above the lowest
  # layer of a stack.
  codeql-unchanged:
    name: ${{ matrix.name }} / CodeQL (${{ matrix.language }}, unchanged)
    needs: plan
    if: needs.plan.outputs.unchanged != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.unchanged) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ${{ matrix.dir }}

      # The API lists analyses newest first.
      - name: Download the results on the base branch
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.stack.base.ref || github.event.pull_request.base.ref }}
          CATEGORY: /language:${{ matrix.language }};project:${{ matrix.dir }}
        run: |
          id=$(gh api "repos/$REPO/code-scanning/analyses?ref=refs/heads/$BASE&tool_name=CodeQL&per_page=100" |
            jq -r --arg c "$CATEGORY" 'first(.[] | select(.category == $c) | .id) // empty')
          if [[ -z $id ]]; then
            echo "No $CATEGORY results on $BASE: nothing to copy."
            exit 0
          fi
          gh api -H 'Accept: application/sarif+json' "repos/$REPO/code-scanning/analyses/$id" > "$RUNNER_TEMP/codeql.sarif"
          echo "found=true" >> "$GITHUB_OUTPUT"

      # The file names its category itself (automationDetails.id).
      - name: Upload them to the pull request
        if: steps.base.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/codeql.sarif

  # The one check the ruleset requires for a project: "Core Status". It
  # exists on every pull request, for every project, so it is never pending.
  # It passes when every job of this run named "<project> / ..." passed or
  # was skipped; `needs` cannot tell that, because it gives one result for
  # the whole matrix, all projects together.
  status:
    name: ${{ matrix.name }} Status
    needs: [plan, check, codeql, codeql-unchanged]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.projects) }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          NAME: ${{ matrix.name }}
        run: |
          gh api --paginate "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=100" --jq '.jobs[]' |
            jq -s --arg p "$NAME / " 'map(select(.name | startswith($p)) | {name, conclusion})' | tee jobs.json
          jq -e 'all(.conclusion == "success" or .conclusion == "skipped")' jobs.json

  # Repository-wide jobs. They run on pull requests only; a push to main is a
  # merge of code that already passed.

  # The agent-file layout check the agent-compat commit hook runs, plus the
  # checker's own tests. Needs python3 >= 3.11 (tomllib); ubuntu-24.04 has 3.12.
  agent-compat:
    name: Agent compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Agent compatibility
        run: python3 scripts/check-agent-compatibility.py

      - name: Checker tests
        run: python3 scripts/test_agent_compatibility.py

  semgrep:
    name: Semgrep SAST
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    container:
      # Keep the version in lockstep with the semgrep hook in prek.toml.
      image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only findings new since the base of the pull request. Exit codes:
      # without --error Semgrep exits 0 even with findings; with it, 1 on
      # findings, 2 on a bad baseline, 7 on a rule or config that fails to load.
      # Any of them fails this step; the upload below still runs.
      - name: Semgrep
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          semgrep scan --sarif --output semgrep.sarif --baseline-commit "$BASE_SHA" \
            --config p/golang --config p/security-audit --config p/github-actions --config .semgrep/ --error

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: Gitleaks Secrets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Keep the version in lockstep with the gitleaks rev in prek.toml.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${BASE_URL}/${ARCHIVE}" -o "${ARCHIVE}"
          curl -sSfL "${BASE_URL}/${CHECKSUMS}" -o "${CHECKSUMS}"
          grep " ${ARCHIVE}$" "${CHECKSUMS}" | sha256sum --check
          sudo tar xzf "${ARCHIVE}" -C /usr/local/bin gitleaks
          rm -f "${ARCHIVE}" "${CHECKSUMS}"

      - name: Gitleaks
        run: gitleaks git --report-format sarif --report-path gitleaks.sarif

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # comment-summary-in-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  # CodeQL for the workflows themselves, the one language that belongs to no
  # project. The `codeql` job scans each project's languages. This job runs on every layer of a stack, so a
  # ruleset that requires CodeQL results finds some on every pull request.
  # Also runs on main: pull request scans compare against it.
  codeql-actions:
    name: Analyze (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:actions

  # The one check the ruleset requires for the repository-wide jobs. Add a
  # new one to `needs`.
  repo-status:
    name: Repository Status
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [agent-compat, semgrep, gitleaks, dependency-review, codeql-actions]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success" or . == "skipped")' <<<"$RESULTS"
