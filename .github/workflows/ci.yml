name: CI

# The monorepo's one entry workflow. Repository-wide jobs (security scans,
# agent files) are here and run on every pull request. Each project's jobs
# are in its own workflow (core.yml), called from here when the pull request
# changes that project.
#
# Stacked pull requests: GitHub triggers workflows as if every layer targets
# the base of the stack, so `branches: [main]` runs this on every layer.
# https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/optimizing-ci-for-stacked-pull-requests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides what the per-project workflows run. Outputs:
  #
  # heavy: a workflow runs once per layer of a stack, so a project's build,
  # lint and test jobs run only on the two layers GitHub's guide names. The
  # top layer (position == size) holds the full set of changes. The lowest
  # unmerged layer (stack base == pull request base) is the next to land; when
  # it merges, GitHub rebases the next layer onto the base, which re-triggers
  # CI with that layer now the lowest. `stack` is null outside a stack.
  #
  # Two outputs per project, because a layer of a stack has two diffs:
  #
  # core: the project changed between the base of the stack and this layer.
  # Gates the build, lint and test jobs. The top layer must test what the
  # layers below it changed, so its own diff is not enough.
  #
  # core-layer: this layer's own diff changes the project. Gates the
  # project's CodeQL scan, which runs on every such layer whatever `heavy`
  # says: code scanning blocks a pull request only for alerts on lines in
  # its own diff, so each layer must be scanned where its lines are.
  #
  # Workflow-level `paths` filters are not used: a workflow skipped that way
  # leaves required checks pending, while a skipped job counts as passing.
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  #
  # Dependents test `!= 'false'`, so an empty output (this job failing) runs everything.
  plan:
    name: Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.gate.outputs.heavy }}
      core: ${{ steps.stack.outputs.core }}
      core-layer: ${{ steps.layer.outputs.core }}
    steps:
      - name: Apply stack gate
        id: gate
        env:
          STACK: ${{ toJSON(github.event.pull_request.stack) }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "stack=$STACK"
          jq -nr --argjson s "$STACK" --arg base "$BASE" \
            'if $s == null or $s.position == $s.size or $s.base.ref == $base then "heavy=true" else "heavy=false" end' \
            | tee -a "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .github/projects.yml lists the paths of each project.

      # With an empty token paths-filter uses git: a two-dot diff from `base`
      # to the merge commit. When the base branch is ahead of the stack, its
      # new files count as changed too; that only runs more, never less.
      - name: Projects changed since the base of the stack
        id: stack
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ''
          base: ${{ github.event.pull_request.stack.base.ref || github.event.pull_request.base.ref }}
          filters: .github/projects.yml

      # With a token paths-filter asks the API for the pull request's files:
      # the diff against the pull request's own base, the layer below.
      - name: Projects changed by this layer
        id: layer
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/projects.yml

  # One caller job per project. Each project has its own workflow file with
  # its build, lint, test and CodeQL jobs. To add a project: add its paths to
  # .github/projects.yml, its two outputs to `plan`, a caller job here, and
  # its name to `needs` of
  # `passed`.
  #
  # A push to main is a merge of code that already passed, so it only scans:
  # pull request scans compare against the results on main.
  core:
    name: core
    needs: plan
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/core.yml
    with:
      test: ${{ github.event_name == 'pull_request' && needs.plan.outputs.heavy != 'false' && needs.plan.outputs.core != 'false' }}
      scan: ${{ needs.plan.outputs.core-layer != 'false' }}

  # Repository-wide jobs. They run on pull requests only; a push to main is a
  # merge of code that already passed.

  # The agent-file layout check the agent-compat commit hook runs, plus the
  # checker's own tests. Needs python3 >= 3.11 (tomllib); ubuntu-24.04 has 3.12.
  agent-compat:
    name: Agent compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Agent compatibility
        run: python3 scripts/check-agent-compatibility.py

      - name: Checker tests
        run: python3 scripts/test_agent_compatibility.py

  semgrep:
    name: Semgrep SAST
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    container:
      # Keep the version in lockstep with the semgrep hook in prek.toml.
      image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only findings new since the base of the pull request. Exit codes:
      # without --error Semgrep exits 0 even with findings; with it, 1 on
      # findings, 2 on a bad baseline, 7 on a rule or config that fails to load.
      # Any of them fails this step; the upload below still runs.
      - name: Semgrep
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          semgrep scan --sarif --output semgrep.sarif --baseline-commit "$BASE_SHA" \
            --config p/golang --config p/security-audit --config p/github-actions --config .semgrep/ --error

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: Gitleaks Secrets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Keep the version in lockstep with the gitleaks rev in prek.toml.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${BASE_URL}/${ARCHIVE}" -o "${ARCHIVE}"
          curl -sSfL "${BASE_URL}/${CHECKSUMS}" -o "${CHECKSUMS}"
          grep " ${ARCHIVE}$" "${CHECKSUMS}" | sha256sum --check
          sudo tar xzf "${ARCHIVE}" -C /usr/local/bin gitleaks
          rm -f "${ARCHIVE}" "${CHECKSUMS}"

      - name: Gitleaks
        run: gitleaks git --report-format sarif --report-path gitleaks.sarif

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # comment-summary-in-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  # CodeQL for the workflows themselves, the one language that belongs to no
  # project. A project's languages are scanned in its own workflow, with its
  # own toolchain and category. This job runs on every layer of a stack, so a
  # ruleset that requires CodeQL results finds some on every pull request.
  # Also runs on main: pull request scans compare against it.
  codeql:
    name: Analyze (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:actions

  # The one required status check. It passes when every job above passed or
  # was skipped, so the ruleset never names a project's jobs and a skipped
  # project cannot leave a required check pending.
  passed:
    name: CI passed
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [plan, core, agent-compat, semgrep, gitleaks, dependency-review, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check every job
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success" or . == "skipped")' <<<"$RESULTS"
