# Version updates run monthly. Security updates are separate: Dependabot opens
# them as soon as an advisory is published, whatever this schedule says.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: monthly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy/api
    schedule:
      interval: monthly

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
