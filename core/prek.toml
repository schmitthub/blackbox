# prek hooks for the Go module. prek finds this file from the repository
# root (workspace mode) and runs these hooks in core/.
#
# Scheduling: lower priority runs first; hooks sharing a priority run
# concurrently. go-mod-tidy and mockery change files, so they run in the
# "fix" tier before every scan that reads them.

[priorities]
fix = 0
build = 7
scan = 10

# Vulnerability (Go call analysis) and license allowlist gate.
[[repos]]
repo = "https://github.com/google/osv-scanner"
rev = "02f96a40691c2d155fdda799af436e111231e365" # frozen: v2.7.1

[[repos.hooks]]
id = "osv-scanner"
# prek builds the hook; use the installed Go toolchain, never a download.
language_version = "system"
args = ["scan", "source", "--lockfile=go.mod", "--call-analysis=go", "--licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0"]
priority = "scan"

# ── Tidy (mutates go.mod/go.sum — must precede the scan tier) ─────────────

[[repos]]
repo = "https://github.com/tekwizely/pre-commit-golang"
rev = "f298c082154b2cb239fac06a4f452368e66e66dd" # frozen: v1.0.0-rc.4

[[repos.hooks]]
id = "go-mod-tidy"
priority = "fix"

# ── Local ─────────────────────────────────────────────────────────────────

[[repos]]
repo = "local"

[[repos.hooks]]
id = "golangci-lint"
name = "golangci-lint"
# golangci-lint is pinned in mise.toml; CI installs the same one with mise-action.
entry = "make lint"
language = "system"
types = ["go"]
pass_filenames = false
priority = "scan"

[[repos.hooks]]
id = "semgrep"
name = "Semgrep SAST"
# Expected version: 1.185.0 (must match the CI image tag in ci.yml).
# --error is required: without it Semgrep exits 0 even with findings.
entry = "semgrep scan --config p/golang --config p/security-audit --error"
language = "system"
types = ["go"]
pass_filenames = false
priority = "scan"

[[repos.hooks]]
id = "mockery"
name = "Mocks up to date"
# Regenerates the mocks; prek fails the commit when a file changes.
# mockery is pinned in mise.toml; CI installs the same one with mise-action.
entry = "make mocks"
language = "system"
types = ["go"]
pass_filenames = false
priority = "fix"

[[repos.hooks]]
id = "go-test"
name = "Unit tests"
entry = "make test"
language = "system"
types = ["go"]
pass_filenames = false
priority = "build"
