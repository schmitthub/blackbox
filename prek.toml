# prek hooks for the whole repository. Each project has its own prek.toml
# (core/prek.toml); prek finds them from here and runs their hooks in the
# project's directory.
# Install: prek install
# Run all: prek run --all-files

[priorities]
scan = 10

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e" # frozen: v8.30.1

[[repos.hooks]]
id = "gitleaks"
priority = "scan"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "semgrep-actions"
name = "Semgrep GitHub Actions"
# Expected version: 1.185.0 (must match the CI image tag in ci.yml).
# Scans workflow YAML: p/github-actions catches the pull_request_target
# checkout (pwn-request); .semgrep/ adds the pull_request_target cache
# (poisoning) rule. --error is required: without it Semgrep exits 0 even
# with findings.
entry = "semgrep scan --config p/github-actions --config .semgrep/ --error"
language = "system"
files = '^\.github/workflows/.*\.ya?ml$'
pass_filenames = false
priority = "scan"

[[repos.hooks]]
id = "agent-compat"
name = "Agent compatibility"
entry = "python3 scripts/check-agent-compatibility.py"
language = "system"
always_run = true
pass_filenames = false
priority = "scan"
